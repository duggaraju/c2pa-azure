[package]
name = "cli"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["azure"]
azure = ["examples-common/azure", "c2pa-cloud/azure"]
aws = ["examples-common/aws", "c2pa-cloud/aws"]
gcp = ["examples-common/gcp", "c2pa-cloud/gcp"]

[dependencies]
anyhow = { workspace = true }
c2pa = { workspace = true }
c2pa-cloud = { path = "../../lib" }
clap = { version = "4.6.1", features = ["derive", "env"] }
env_logger = { workspace = true }
examples-common = { path = "../common" }
log = { workspace = true }
tokio = { workspace = true }
url = "2.5.8"
