[package]
name = "keda-worker"
version = "0.1.0"
edition = "2024"
publish = false

[features]
default = ["azure"]
azure = ["examples-common/azure", "dep:azure_core", "dep:azure_identity", "dep:azure_storage_blob"]
aws = ["examples-common/aws", "dep:aws-config", "dep:aws-sdk-s3", "dep:aws-sdk-sqs", "dep:percent-encoding", "dep:serde", "dep:serde_json"]
gcp = ["examples-common/gcp", "dep:google-cloud-storage"]

[dependencies]
anyhow = { workspace = true }
async-trait = { workspace = true }
c2pa = { workspace = true }
env_logger = { workspace = true }
examples-common = { path = "../common" }
futures = { workspace = true }
log = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["fs"] }

aws-config = { workspace = true, optional = true }
aws-sdk-s3 = { workspace = true, optional = true }
aws-sdk-sqs = { workspace = true, optional = true }
azure_core = { workspace = true, optional = true }
azure_identity = { workspace = true, optional = true }
azure_storage_blob = { version = "1.1.0", optional = true }
google-cloud-storage = { workspace = true, optional = true }
percent-encoding = { version = "2.3.2", optional = true }
serde = { version = "1.0.229", features = ["derive"], optional = true }
serde_json = { version = "1.0.151", optional = true }
