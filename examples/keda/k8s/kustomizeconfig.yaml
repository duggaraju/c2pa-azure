nameReference:
  - kind: ConfigMap
    version: v1
    fieldSpecs:
      - kind: ScaledJob
        path: spec/jobTargetRef/template/spec/containers/envFrom/configMapRef/name
  - kind: Secret
    version: v1
    fieldSpecs:
      - kind: ScaledJob
        path: spec/jobTargetRef/template/spec/volumes/secret/secretName
  - kind: ServiceAccount
    version: v1
    fieldSpecs:
      - kind: ScaledJob
        path: spec/jobTargetRef/template/spec/serviceAccountName
  - kind: TriggerAuthentication
    group: keda.sh
    version: v1alpha1
    fieldSpecs:
      - kind: ScaledJob
        path: spec/triggers/authenticationRef/name
