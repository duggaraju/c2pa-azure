[package]
name = "examples-common"
version = "0.1.0"
edition = "2024"
publish = false
description = "Cloud selection and signer construction shared by the c2pa-cloud examples."

[features]
azure = ["c2pa-cloud/azure", "dep:azure_core", "dep:azure_identity"]
aws = ["c2pa-cloud/aws"]
gcp = ["c2pa-cloud/gcp"]

[dependencies]
anyhow = { workspace = true }
c2pa = { workspace = true }
c2pa-cloud = { path = "../../lib" }
log = { workspace = true }

azure_core = { workspace = true, optional = true }
azure_identity = { workspace = true, optional = true }
