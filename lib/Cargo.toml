[package]
name = "c2pa-cloud"
version = { workspace = true }
edition = "2024"
description = "Rust helpers for issuing C2PA signatures with cloud signing services: Azure Trusted Signing, AWS KMS, and Google Cloud KMS."
repository = "https://github.com/duggaraju/c2pa-azure"
homepage = "https://github.com/duggaraju/c2pa-azure"
documentation = "https://docs.rs/c2pa-cloud"
keywords = ["c2pa", "azure", "aws", "gcp", "content-authenticity"]
license-file = "../LICENSE"
readme = "README.md"
# Not published until the multi-cloud API is ready; c2pa-azure keeps releasing from azure/lib.
# Before publishing, add a `version` to the c2pa-azure dependency below.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = ["pdf", "rust_native_crypto"]
pdf = ["c2pa/pdf", "c2pa-azure?/pdf"]
openssl = ["c2pa/openssl", "c2pa-azure?/openssl"]
rust_native_crypto = ["c2pa/rust_native_crypto", "c2pa-azure?/rust_native_crypto"]
azure = ["dep:c2pa-azure"]
aws = ["dep:aws-sdk-kms", "dep:aws-config", "dep:sha2"]
gcp = ["dep:google-cloud-kms-v1", "dep:sha2"]

[dependencies]
async-trait = { workspace = true }
c2pa = { workspace = true }
cms = "0.2.3"
envconfig = { workspace = true }
log = { workspace = true }
sha2 = { version = "0.11.0", optional = true }
url = "2.5.8"

c2pa-azure = { path = "../azure/lib", default-features = false, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-kms = { workspace = true, optional = true }
google-cloud-kms-v1 = { workspace = true, optional = true }

[dev-dependencies]
serde_json = "1.0.151"
tokio = { workspace = true }
