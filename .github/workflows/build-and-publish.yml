name: Build and Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to build and publish (for example, v0.90.14)"
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      CARGO_REGISTRY_TOKEN:
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          lfs: true

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --workspace --release

      - name: Run tests
        run: cargo test --workspace

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  publish:
    needs: build
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release tag matches crate versions
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          METADATA=$(cargo metadata --no-deps --format-version 1)
          PACKAGE_VERSION=$(jq -r '.packages[] | select(.name == "c2pa-azure") | .version' <<< "$METADATA")
          CLOUD_VERSION=$(jq -r '.packages[] | select(.name == "c2pa-cloud") | .version' <<< "$METADATA")
          if [ "$RELEASE_TAG" != "v$PACKAGE_VERSION" ]; then
            echo "Release tag $RELEASE_TAG does not match c2pa-azure version $PACKAGE_VERSION"
            exit 1
          fi

          # c2pa-cloud is a preview that is released as a pre-release of the same version.
          if [ "$CLOUD_VERSION" != "$PACKAGE_VERSION-preview" ]; then
            echo "c2pa-cloud version $CLOUD_VERSION does not match $PACKAGE_VERSION-preview"
            exit 1
          fi

      - name: Publish c2pa-azure and c2pa-cloud to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          # Skip versions that are already published so a partially failed release can be re-run.
          # Cargo publishes the remaining crates in dependency order (c2pa-azure first).
          METADATA=$(cargo metadata --no-deps --format-version 1)
          PACKAGES=()
          for CRATE in c2pa-azure c2pa-cloud; do
            VERSION=$(jq -r --arg crate "$CRATE" '.packages[] | select(.name == $crate) | .version' <<< "$METADATA")
            STATUS=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "$GITHUB_REPOSITORY release workflow" \
              "https://crates.io/api/v1/crates/$CRATE/$VERSION")
            if [ "$STATUS" = "200" ]; then
              echo "$CRATE $VERSION is already on crates.io; skipping"
            else
              PACKAGES+=(-p "$CRATE")
            fi
          done

          if [ ${#PACKAGES[@]} -eq 0 ]; then
            echo "Nothing to publish"
            exit 0
          fi
          cargo publish "${PACKAGES[@]}"

  github-release:
    needs: publish
    runs-on: ubuntu-26.04
    steps:
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release $RELEASE_TAG already exists; skipping"
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$RELEASE_TAG"
