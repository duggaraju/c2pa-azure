name: Sync workspace version with c2pa

on:
  pull_request_target:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract c2pa dependency version
        id: c2pa
        run: |
          # Read the resolved version from Cargo.lock; the Cargo.toml requirement
          # (e.g. "0.90.14") may not change for semver-compatible patch bumps.
          C2PA_VERSION=$(sed -n '/^name = "c2pa"$/{n;s/version = "\(.*\)"/\1/p}' Cargo.lock)
          echo "version=$C2PA_VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected c2pa version: $C2PA_VERSION"

      - name: Extract current workspace version
        id: workspace
        run: |
          WS_VERSION=$(sed -n '/\[workspace\.package\]/,/^\[/{/^version\s*=/{s/.*"\([^"]*\)".*/\1/p}}' Cargo.toml)
          echo "version=$WS_VERSION" >> "$GITHUB_OUTPUT"
          echo "Current workspace version: $WS_VERSION"

      - name: Extract declared c2pa version
        id: c2pa_requirement
        run: |
          C2PA_REQUIREMENT=$(sed -n 's/^c2pa = { version = "\([^"]*\)".*/\1/p' Cargo.toml)
          echo "version=$C2PA_REQUIREMENT" >> "$GITHUB_OUTPUT"
          echo "Declared c2pa version: $C2PA_REQUIREMENT"

      - name: Extract README c2pa version
        id: readme
        run: |
          README_VERSION=$(sed -n 's/.*c2pa-rs \([0-9][0-9.]*\).*/\1/p' README.md | head -n 1)
          echo "version=$README_VERSION" >> "$GITHUB_OUTPUT"
          echo "README c2pa version: $README_VERSION"

      - name: Install Rust toolchain
        if: steps.c2pa.outputs.version != steps.workspace.outputs.version || steps.c2pa.outputs.version != steps.c2pa_requirement.outputs.version || steps.c2pa.outputs.version != steps.readme.outputs.version
        uses: dtolnay/rust-toolchain@stable

      - name: Synchronize workspace and c2pa versions
        if: steps.c2pa.outputs.version != steps.workspace.outputs.version || steps.c2pa.outputs.version != steps.c2pa_requirement.outputs.version || steps.c2pa.outputs.version != steps.readme.outputs.version
        run: |
          C2PA_VERSION="${{ steps.c2pa.outputs.version }}"
          sed -i "/\[workspace\.package\]/,/^\[/s/^version = \".*\"/version = \"$C2PA_VERSION\"/" Cargo.toml
          sed -i "s/^c2pa = { version = \"[^\"]*\"/c2pa = { version = \"$C2PA_VERSION\"/" Cargo.toml
          sed -i -E \
            -e "s|(c2pa-rs )[0-9]+\.[0-9]+\.[0-9]+|\1$C2PA_VERSION|" \
            -e "s|(c2pa--rs-)[0-9]+\.[0-9]+\.[0-9]+|\1$C2PA_VERSION|" \
            -e "s|(crates/c2pa/)[0-9]+\.[0-9]+\.[0-9]+|\1$C2PA_VERSION|" \
            README.md
          cargo check --workspace
          echo "Synchronized workspace, c2pa, and README versions to $C2PA_VERSION"

      - name: Commit and push
        if: steps.c2pa.outputs.version != steps.workspace.outputs.version || steps.c2pa.outputs.version != steps.c2pa_requirement.outputs.version || steps.c2pa.outputs.version != steps.readme.outputs.version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.toml Cargo.lock README.md
          git commit -m "chore: bump workspace version to ${{ steps.c2pa.outputs.version }}"
          git push
